[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magicjack-checkin"
version = "0.1.0"
description = "Call a reservation line and key in digits on a schedule to check in."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sip = ["pyVoIP>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
magicjack-checkin = "magicjack_checkin.cli:main"

[tool.setuptools]
packages = ["magicjack_checkin", "magicjack_checkin.backends"]
